services:
  traefik:
    image: traefik:v3.2
    command:
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme.json:/etc/traefik/acme.json
    networks:
      - api
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: resu-me_backend:${GIT_SHA:-latest}
    env_file:
      - ./backend/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.routers.backend-tls.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend-tls.entrypoints=websecure"
      - "traefik.http.routers.backend-tls.priority=10"
      - "traefik.http.routers.backend-tls.tls=true"
      - "traefik.http.routers.backend-tls.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    networks:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: resu-me_frontend:${GIT_SHA:-latest}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend-tls.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend-tls.entrypoints=websecure"
      - "traefik.http.routers.frontend-tls.priority=1"
      - "traefik.http.routers.frontend-tls.tls=true"
      - "traefik.http.routers.frontend-tls.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - api
    restart: unless-stopped

networks:
  api:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
